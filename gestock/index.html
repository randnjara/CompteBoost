<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestock FB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%2316a34a%22/%3E%3Cpath d=%22M9 13h14v10H9zM12 13V10a4 4 0 0 1 8 0v3%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.4%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Gestock FB : sidebar bleu marine, zone claire, cartes colorées, tableaux fins (modèle « Rapport Gérante ») */
:root{
  --nav:#0a1b36; --nav2:#102a52; --nav-ink:#c9d6ea; --nav-on:#ffffff; --nav-act:#1d4ed8;
  --bg:#eef3fa; --surface:#ffffff; --ink:#0f1f38; --title:#0b2350; --muted:#62748f; --line:#dde5f0; --soft:#f5f8fc; --head:#eef3fb;
  --blue:#1d6ff2; --green:#16a34a; --red:#dc2626; --orange:#f97316; --purple:#7c3aed; --teal:#0891b2; --amber:#d97706;
  --bluebg:#e6efff; --greenbg:#e3f6ea; --redbg:#fde8e8; --orangebg:#fff0e3; --purplebg:#efe8ff; --amberbg:#fff6dc; --graybg:#eef1f5;
  --shadow:0 1px 2px rgba(10,27,54,.05),0 4px 14px rgba(10,27,54,.06);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1424; --surface:#121e33; --ink:#e4ecf7; --title:#dbe7fb; --muted:#93a4bd; --line:#24344f; --soft:#152440; --head:#18294a;
  --bluebg:#15284d; --greenbg:#113522; --redbg:#3a1618; --orangebg:#3a2410; --purplebg:#2a1d4d; --amberbg:#3a2c0e; --graybg:#1c2a40; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1424; --surface:#121e33; --ink:#e4ecf7; --title:#dbe7fb; --muted:#93a4bd; --line:#24344f; --soft:#152440; --head:#18294a;
  --bluebg:#15284d; --greenbg:#113522; --redbg:#3a1618; --orangebg:#3a2410; --purplebg:#2a1d4d; --amberbg:#3a2c0e; --graybg:#1c2a40; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;color:var(--title)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* Sidebar */
.side{background:linear-gradient(180deg,var(--nav),#071328);color:var(--nav-ink);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .lg{width:36px;height:36px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:#fff}
.brand b{display:block;color:#fff;font-size:15px}.brand small{color:#8fa3c4;font-size:11px}
.nav{padding:10px 8px;display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;color:var(--nav-ink);cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:var(--nav-act);color:#fff;box-shadow:0 4px 12px rgba(29,78,216,.35)}
.nav .sep{height:1px;background:rgba(255,255,255,.07);margin:6px 6px}
.nav .soon{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.1);border-radius:99px;padding:1px 6px;color:#9fb2d0}
.side .foot{margin-top:auto;padding:12px 16px;font-size:11px;color:#7f93b4;border-top:1px solid rgba(255,255,255,.07)}
.side .foot a{color:#b9c9e4}
.ico{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Main */
.main{min-width:0;padding:14px 18px 60px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.ttl{display:flex;gap:10px;align-items:center}
.ttl .ic{width:40px;height:40px;border-radius:10px;background:var(--bluebg);color:var(--blue);display:grid;place-items:center}
.ttl h1{font-size:20px;font-weight:800}.ttl p{margin:0;color:var(--muted);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fld{display:grid;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.fld select,.fld input,.in{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0}
.fld small{font-weight:500;font-size:10px}
.btn{height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}.btn.b{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}.btn.o{background:var(--orange);border-color:var(--orange);color:#fff}.btn.p{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12px}.btn.w{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.burger{display:none}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{border-radius:12px;padding:10px;display:flex;gap:9px;align-items:center;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.kpi .ki{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi .kl{font-size:11px;font-weight:600;opacity:.9}.kpi .kv{font-size:clamp(14px,1.05vw,18px);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}.kpi .ks{font-size:11px;opacity:.85}
.kpi.solid{color:#fff;border:0}.kpi.solid .ki{background:rgba(255,255,255,.2)}
.kpi.cb{background:linear-gradient(135deg,#1d6ff2,#2f84ff)}.kpi.cg{background:linear-gradient(135deg,#15a34a,#22c55e)}.kpi.cg2{background:linear-gradient(135deg,#0f8a3e,#16a34a)}
.kpi.tg .ki{background:var(--greenbg);color:var(--green)}.kpi.tb .ki{background:var(--bluebg);color:var(--blue)}.kpi.to .ki{background:var(--orangebg);color:var(--orange)}
.kpi.tr{background:var(--redbg);border-color:transparent}.kpi.tr .ki{background:var(--red);color:#fff}.kpi.tr .kv{color:var(--red)}
.kpi.tp{background:var(--purplebg);border-color:transparent}.kpi.tp .ki{background:var(--purple);color:#fff}.kpi.tp .kv{color:var(--purple)}
.up{color:var(--green)}.down{color:var(--red)}.kpi.solid .up,.kpi.solid .down{color:#fff}
/* Période */
.perbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{white-space:nowrap;border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--nav2);color:#fff}
.strip{display:flex;gap:4px;align-items:center;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.strip .d{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;min-width:72px;text-align:center;cursor:pointer;line-height:1.25}
.strip .d b{display:block;font-size:12px}.strip .d small{font-size:10px;color:var(--muted)}
.strip .d.on{background:var(--bluebg);border-color:var(--blue);color:var(--blue)}.strip .d.on small{color:var(--blue)}
.strip .arr{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}
/* Cartes */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.15fr) minmax(0,1fr);gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card>.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.card>.hd h2{font-size:14px;font-weight:700}.card>.bd{padding:12px}
.card>.hd .sp{flex:1}
.hd.green{background:linear-gradient(90deg,#15803d,#16a34a);color:#fff;border-radius:12px 12px 0 0}.hd.green h2{color:#fff}
.hd.navy{background:linear-gradient(90deg,var(--nav),var(--nav2));color:#fff;border-radius:12px 12px 0 0}.hd.navy h2{color:#fff}
.num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:99px;background:rgba(255,255,255,.25);font-size:11px;font-weight:800}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.g{background:var(--greenbg);color:var(--green)}.tag.r{background:var(--redbg);color:var(--red)}.tag.o{background:var(--orangebg);color:var(--orange)}
.tag.b{background:var(--bluebg);color:var(--blue)}.tag.p{background:var(--purplebg);color:var(--purple)}.tag.n{background:var(--graybg);color:var(--muted)}.tag.a{background:var(--amberbg);color:var(--amber)}
.tag.solidr{background:var(--red);color:#fff}
/* Tableaux */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--head);font-size:11px;font-weight:700;color:var(--title)}
th.l,td.l{text-align:left}th.c,td.c{text-align:center}
thead tr.grp th{background:var(--soft);font-size:11px;border-bottom:0}
tbody tr:hover td{background:var(--soft)}
tfoot td{font-weight:800;background:var(--head)}
.cE{color:var(--green)}.cM{color:var(--blue)}.cO{color:var(--orange)}.cR{color:var(--red);font-weight:700}.cP{color:var(--purple)}
.th-rest{background:var(--redbg)!important;color:var(--red)!important}.th-ver{background:var(--greenbg)!important;color:var(--green)!important}
.who{display:flex;gap:8px;align-items:center}.av{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}
.ib{width:28px;height:28px;border-radius:7px;border:0;background:var(--blue);color:#fff;display:inline-grid;place-items:center;cursor:pointer}
.empty{padding:22px;text-align:center;color:var(--muted)}
/* Synthèse */
.syn .row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line)}
.syn .row:last-child{border:0}.syn .row .ki{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.syn .row span{flex:1}.syn .row b{font-variant-numeric:tabular-nums}
/* Formulaires */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;background:var(--soft);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-color:var(--blue);background:var(--surface)}
.form{display:grid;gap:9px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f3{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}
.lab{display:grid;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.lab input,.lab select,.lab textarea{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 9px;width:100%;min-width:0}
.lab textarea{height:56px;padding:6px 9px;resize:vertical}
.lab .req{color:var(--red)}
.totl{display:flex;justify-content:space-between;align-items:center;font-weight:800;padding:8px 10px;border-radius:8px;background:var(--soft)}
.paybox{border:1px solid #f5c2c2;background:var(--redbg);border-radius:10px;padding:10px;display:grid;gap:8px}
.paybox h3{font-size:12px;color:var(--red)}
.paybox .sub{font-size:11px;font-weight:700;color:var(--ink)}
.restel{display:flex;justify-content:space-between;font-weight:800;color:var(--red);font-size:14px}
.cmdgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.mini{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.mini>.mh{padding:8px 10px;font-weight:700;font-size:12px;display:flex;gap:6px;align-items:center}
.mini>.mb{padding:10px;display:grid;gap:8px}
.mh.b{background:var(--bluebg);color:var(--blue)}.mh.r{background:var(--redbg);color:var(--red)}.mh.o{background:var(--orange);color:#fff}.mh.p{background:var(--purple);color:#fff}
.chk{display:flex;gap:6px;align-items:center;font-size:12px}
.msg{font-size:12px;min-height:1em}.msg.ok{color:var(--green)}.msg.ko{color:var(--red)}
.note{background:var(--amberbg);color:var(--amber);border-radius:8px;padding:8px 10px;font-size:12px}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.ko{background:var(--red)}
dialog{border:0;border-radius:14px;padding:0;max-width:min(440px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(5,15,35,.5)}
.demo{background:var(--amber);color:#fff;text-align:center;font-weight:700;padding:5px;font-size:12px}
.wait{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.stack{display:grid;gap:12px}
.bars{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.steps{margin:0;padding-left:18px;display:grid;gap:6px}
@media (max-width:1500px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:1250px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.grid3>:last-child{grid-column:1/-1}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(5,15,35,.45)}
  .burger{display:inline-flex}
  .main{padding:12px 16px 70px}
  .grid3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{width:100%}.filters .fld{flex:1 1 140px}.filters .fld select{width:100%}
}
@media (max-width:420px){.f3{grid-template-columns:1fr 1fr}.f3>:first-child{grid-column:1/-1}.kpi .kv{font-size:15px}}
@media print{.side,.filters,.perbar,.no-print,.cb-out,.cb-net{display:none!important}.app{display:block}.card{box-shadow:none;break-inside:avoid}body{background:#fff}}
</style>
<script>
/* ?demo=1 : démonstration avec des données fictives, sans connexion à la base */
window.GS_DEMO=/[?&]demo=1/.test(location.search);
if(!window.GS_DEMO){document.write('<script src="../config.js?v=41"><\/script><script src="../supabase.js?v=41"><\/script><script src="../web.js?v=41"><\/script>')}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head><body>
<div id="app"><div class="wait">Chargement de Gestock FB…</div></div>
<script src="demo.js"></script>
<script src="app.js"></script>
</body></html>
