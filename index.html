<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231877f2%22/%3E%3Ctext x=%2216%22 y=%2224%22 font-size=%2222%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3Ef%3C/text%3E%3C/svg%3E">
<style>*{box-sizing:border-box}html,body{margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}</style></head><body>
<title>Compte Boost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Mise en page : barre latérale d'icônes (admin) ou barre du haut (employé), cartes blanches sur fond bleu ciel, tableaux fins */
:root{
  --bg:#f0f9ff; --bg2:#e0f2fe; --surface:#ffffff; --ink:#0c2a43; --title:#075985; --muted:#5b7287; --line:#d6e7f3; --soft:#f2f8fd; --head:#eaf5fd;
  --sky:#38bdf8; --pro:#0284c7; --dark:#075985; --accent:#0284c7; --accent-ink:#ffffff;
  --up:#15803d; --down:#dc2626; --warn:#ea580c; --flat:#64748b; --upbg:#dcfce7; --downbg:#fee2e2; --warnbg:#ffedd5; --flatbg:#eef2f6;
  --s1:#0284c7; --s2:#16a34a; --s3:#ea580c; --s0:#b6c7d4;
  --shadow:0 1px 2px rgba(7,89,133,.06),0 6px 18px rgba(7,89,133,.07);
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1722; --bg2:#0d2232; --surface:#11212f; --ink:#e3eef6; --title:#7dd3fc; --muted:#8fa7b9; --line:#21384b; --soft:#152838; --head:#16314a;
  --sky:#38bdf8; --pro:#38bdf8; --dark:#7dd3fc; --accent:#38bdf8; --accent-ink:#04131f;
  --up:#4ade80; --down:#f87171; --warn:#fb923c; --flat:#94a3b8; --upbg:#12321f; --downbg:#3b1717; --warnbg:#3a2412; --flatbg:#1f2b36;
  --s1:#1693d6; --s2:#22a355; --s3:#e0701f; --s0:#3d5263; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1722; --bg2:#0d2232; --surface:#11212f; --ink:#e3eef6; --title:#7dd3fc; --muted:#8fa7b9; --line:#21384b; --soft:#152838; --head:#16314a;
  --sky:#38bdf8; --pro:#38bdf8; --dark:#7dd3fc; --accent:#38bdf8; --accent-ink:#04131f;
  --up:#4ade80; --down:#f87171; --warn:#fb923c; --flat:#94a3b8; --upbg:#12321f; --downbg:#3b1717; --warnbg:#3a2412; --flatbg:#1f2b36;
  --s1:#1693d6; --s2:#22a355; --s3:#e0701f; --s0:#3d5263; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--bg2),var(--bg) 320px);background-color:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
h1,h2,h3{margin:0;color:var(--title);text-wrap:balance}
h1{font-size:1.25rem;font-weight:800}
h2{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px}
h2 small,h1 small{font-size:.75rem;font-weight:500;color:var(--muted)}
h3{font-size:.92rem;font-weight:700}
.label{font-size:.72rem;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}
/* ---- Structure ---- */
.app{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:100vh}
.app{background:linear-gradient(90deg,var(--surface) 76px,transparent 76px)}
.app.emp{grid-template-columns:minmax(0,1fr);background:none}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;position:sticky;top:0;height:100vh}
.side .logo{margin-bottom:8px}
.side button{width:58px;border:0;background:none;border-radius:12px;padding:8px 2px;display:grid;justify-items:center;gap:3px;color:var(--muted);font:600 .6rem/1.15 var(--body);cursor:pointer}
.side button svg{width:20px;height:20px}
.side button span{display:none;text-align:center}
.side button[aria-current="true"]{background:var(--pro);color:#fff}
.side button[aria-current="true"] span{display:block}
.side button:hover:not([aria-current="true"]){background:var(--soft);color:var(--title)}
.main{min-width:0;padding:14px 18px 40px;display:grid;gap:14px;align-content:start}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.topbar .brand{display:flex;gap:10px;align-items:center;margin-right:auto}
.topbar .brand b{display:block;color:var(--title);font-size:1.05rem;font-weight:800}
.topbar .brand span:not(.logo){font-size:.78rem;color:var(--muted)}
.logo{width:40px;height:40px;border-radius:10px;background:#1877f2;color:#fff;display:grid;place-items:center;font:800 1.5rem/1 var(--body);flex:none}
.logo.sm{width:30px;height:30px;font-size:1.1rem;border-radius:8px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);min-height:42px}
.pill .who{display:grid;line-height:1.2}
.pill .who b{font-size:.85rem;color:var(--title)}
.pill .who small{font-size:.7rem;color:var(--muted)}
.bell{position:relative;width:42px;justify-content:center;padding:0;cursor:pointer}
.bell i{position:absolute;top:4px;right:5px;background:var(--down);color:#fff;font:700 .6rem/1 var(--body);border-radius:999px;padding:2px 5px;font-style:normal}
.navbtn{border:1px solid var(--line);background:var(--surface);color:var(--title);border-radius:12px;padding:9px 14px;font:700 .85rem var(--body);display:inline-flex;gap:8px;align-items:center;cursor:pointer;box-shadow:var(--shadow)}
.navbtn[aria-current="true"]{background:var(--pro);color:#fff;border-color:var(--pro)}
.navbtn svg{width:16px;height:16px}
.tz{font-size:.72rem}
.tz b{font-family:var(--mono);font-size:.8rem;color:var(--title)}
/* ---- Cartes ---- */
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0;align-content:start;box-shadow:var(--shadow)}
.bh{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.ic{width:22px;height:22px;color:var(--pro);flex:none}
.ic.g{color:var(--up)} .ic.r{color:var(--down)} .ic.o{color:var(--warn)}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
.tile svg{width:24px;height:24px}
.tile.b{background:linear-gradient(135deg,#38bdf8,#0284c7)} .tile.g{background:linear-gradient(135deg,#4ade80,#16a34a)}
.tile.o{background:linear-gradient(135deg,#fdba74,#ea580c)} .tile.r{background:linear-gradient(135deg,#f87171,#dc2626)}
.tile.l{background:var(--bg2);color:var(--pro)} .tile.lg{background:var(--upbg);color:var(--up)}
.tile.sm{width:34px;height:34px;border-radius:10px} .tile.sm svg{width:18px;height:18px}
.kpis{display:grid;grid-template-columns:1.25fr 1.25fr 1fr 1fr 1fr;gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start;min-width:0;box-shadow:var(--shadow)}
.kpi .t{font-size:.76rem;font-weight:700;color:var(--title);line-height:1.2}
.kpi .t small{display:block;font-weight:500;color:var(--muted);font-size:.68rem}
.kpi .v{font-size:2rem;font-weight:800;line-height:1.05;color:var(--title);font-variant-numeric:tabular-nums}
.kpi .row2{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;flex-wrap:wrap}
.kpi .cmp{font-size:.72rem;text-align:right;color:var(--muted)}
.kpi .s{font-size:.72rem;color:var(--muted)}
.kpi>div{min-width:0;flex:1}
.v.g{color:var(--up)} .v.r{color:var(--down)} .v.o{color:var(--warn)} .v.b{color:var(--pro)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g2e{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gside{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
/* ---- Tableaux ---- */
.tb{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:var(--head);color:var(--title);font-size:.72rem;font-weight:700;padding:8px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
th.n,td.n,th.c,td.c{text-align:center}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
td.pg{font-weight:700;color:var(--title)}
.tot{background:var(--bg2)!important;font-weight:800;color:var(--title)}
th.tot{background:var(--bg2)}
.today{background:var(--bg2)}
table.rec td,table.rec th{border-right:1px solid var(--line)}
table.rec td:last-child,table.rec th:last-child{border-right:0}
table.rec td.n{font-size:.95rem}
.rl{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--title)}
.rl small{display:block;font-weight:500;color:var(--muted);font-size:.66rem}
.rk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;color:#fff;font-weight:800;font-size:.75rem}
.rk.g{background:var(--up)} .rk.r{background:var(--down)}
.minibar{display:grid;gap:2px;width:90px}
.minibar i{display:block;height:6px;border-radius:3px}
/* ---- Puces et évolutions ---- */
.ev{font-family:var(--mono);font-weight:700;white-space:nowrap}
.ev.up{color:var(--up)} .ev.down{color:var(--down)} .ev.flat{color:var(--flat)}
.sg{font-family:var(--mono);font-weight:700}
.sg.up{color:var(--up)} .sg.down{color:var(--down)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--upbg);color:var(--up)} .chip.ko{background:var(--downbg);color:var(--down)} .chip.wa{background:var(--warnbg);color:var(--warn)} .chip.no{background:var(--flatbg);color:var(--flat)} .chip.bl{background:var(--bg2);color:var(--pro)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.nodot::before{display:none}
.okc{color:var(--up)} .koc{color:var(--down)} .wac{color:var(--warn)}
/* ---- Contrôles ---- */
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0}
input[type=number]{font-family:var(--mono)}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
button{font:inherit;font-weight:600;border-radius:9px;padding:7px 13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--title)}
button.primary{background:var(--pro);color:#fff;border-color:var(--pro)}
button.darkb{background:#0f2a43;color:#fff;border-color:#0f2a43}
button.small{padding:4px 10px;font-size:.78rem}
button.link{border:0;background:none;padding:2px 4px;color:var(--pro);font-weight:600;text-decoration:underline}
button svg.ic{width:15px;height:15px}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.eye{white-space:nowrap;border-color:#bfdcf2;color:var(--pro);font-size:.74rem;padding:3px 10px;border-radius:999px;background:var(--surface)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:8px;font-size:.8rem}
.seg button[aria-pressed="true"]{background:var(--pro);color:#fff;box-shadow:var(--shadow)}
.seg.full{display:flex}.seg.full button{flex:1}
.fbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;box-shadow:var(--shadow)}
.fl{display:grid;gap:2px}
.fl>span{font-size:.68rem;color:var(--muted);font-weight:600}
.fl select{min-width:180px}
.range{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface)}
.range button{border:0;padding:5px 9px;background:none}
.range .lbl{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--title);font-size:.84rem;padding:0 6px;position:relative}
.range .lbl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.msg{font-size:.82rem;min-height:1.2em}
.msg.ok{color:var(--up)} .msg.err{color:var(--down)}
.empty{color:var(--muted);text-align:center;padding:20px 8px;white-space:normal}
.note{background:var(--bg2);border-radius:10px;padding:9px 12px;font-size:.8rem;color:var(--title);display:flex;gap:8px;align-items:flex-start}
.note.g{background:var(--upbg);color:var(--up)} .note.r{background:var(--downbg);color:var(--down)} .note.o{background:var(--warnbg);color:var(--warn)}
.note svg{width:18px;height:18px;flex:none}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px;text-align:center;align-content:center;min-width:0}
.stat .v{font-size:1.5rem;font-weight:800;color:var(--title);font-variant-numeric:tabular-nums}
.stat .l{font-size:.72rem;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
/* ---- Graphique ---- */
.chart svg[role=img]{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;font-size:.74rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.interp{display:grid;gap:8px;align-content:start}
.interp>div{display:flex;gap:8px;align-items:flex-start;font-size:.74rem;color:var(--muted)}
.interp b{display:block;font-size:.78rem}
/* ---- Saisie ---- */
.sgrid{border-collapse:separate;border-spacing:4px;font-size:.8rem}
.sgrid th{background:none;border:0;color:var(--muted);font-weight:600;text-align:center;padding:2px}
.sgrid td{border:0;padding:0;text-align:center}
.sgrid td.bn{text-align:left;font-weight:700;color:var(--title);padding-right:6px}
.sgrid .cell{border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;width:76px;margin:0 auto}
.sgrid td:not(.bn){width:84px}
.sgrid .cell input{border:0;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;text-align:center;width:100%;padding:6px 2px;font-weight:700;background:none}
.sgrid .cell .df{font-family:var(--mono);font-size:.74rem;font-weight:700;padding:3px 0;color:var(--up)}
.sgrid .cell .df.down{color:var(--down)} .sgrid .cell .df.mu{color:var(--muted)}
.sgrid .cell.lock{background:var(--soft)}
.sgrid .cell.lock input{color:var(--ink)}
.sgrid .cell.an{border-color:var(--down)}
.sgrid .rin{border:1px solid var(--line);border-radius:8px;text-align:center;width:76px;padding:6px 2px;font-weight:700}
.sgrid .st{display:grid;gap:3px;justify-items:center;font-weight:700;font-size:.74rem}
.sgrid .st button{font-size:.7rem;padding:2px 8px;border-radius:999px}
.bpause{border-color:#fecaca!important;color:var(--down)!important}
.bresume{border-color:#bbf7d0!important;color:var(--up)!important}
.sgrid .tr td:not(.bn){font-family:var(--mono);font-weight:800}
.savebtn{font-size:.72rem;padding:5px 6px;width:100%;white-space:nowrap;display:block}
.sgrid .when{display:block;margin-top:2px}
.saved{display:grid;gap:1px;font-size:.66rem;color:var(--up);font-weight:700;line-height:1.2}
.saved b{font-size:.72rem}
.saved.rect{color:var(--warn)}
.when{font-size:.62rem;color:var(--muted);line-height:1.2}
.dstate{font-size:.66rem;font-weight:700}
.colsel{background:var(--bg2);border-radius:8px}
/* ---- Fenêtre ---- */
.ovl{position:fixed;inset:0;background:rgba(7,30,50,.45);display:grid;place-items:start center;padding:24px 12px;overflow:auto;z-index:20}
.modal{background:var(--surface);border-radius:16px;max-width:980px;width:100%;padding:16px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{max-width:520px}
.modal textarea{width:100%;min-height:80px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kv>div{background:var(--soft);border-radius:10px;padding:8px 10px;display:grid;gap:1px;min-width:0}
.kv b{color:var(--title);font-size:.92rem;white-space:normal}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 12px;color:var(--muted)}
.subtabs button[aria-pressed="true"]{color:var(--title);border-bottom-color:var(--pro)}
/* ---- Anciennes vues (récapitulatifs, calendrier, validations, équipe) ---- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0;align-content:start;box-shadow:var(--shadow)}
.ph{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.tablebox{overflow-x:auto}
.d{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.d.up{color:var(--up);background:var(--upbg)} .d.down{color:var(--down);background:var(--downbg)} .d.flat{color:var(--flat);background:var(--flatbg)}
.d.plain{background:none;padding:0}
.chip.todo{background:var(--downbg);color:var(--down)} .chip.none{background:var(--flatbg);color:var(--flat)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pro);border-radius:14px;padding:12px 14px;display:grid;gap:3px;align-content:start;min-width:0}
.card .v{font-size:1.6rem;font-weight:800;color:var(--title)}
.card .s{font-size:.8rem;min-height:1.3em}
.cpt{font-family:var(--mono);font-weight:700;white-space:nowrap}
.pbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week button{display:grid;justify-items:center;padding:6px 4px;background:var(--soft);border-color:transparent}
.week button span{font-size:.72rem;color:var(--muted)}
.week button.on{background:var(--pro);color:#fff} .week button.on span{color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-radius:999px;padding:5px 12px;font-size:.82rem}
.chips button[aria-pressed="true"]{background:var(--bg2);color:var(--title);border-color:var(--pro)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:.7rem;color:var(--muted);text-align:center;font-weight:600;padding:4px 0}
.cal button{min-height:54px;padding:6px;text-align:left;display:grid;align-content:space-between;gap:2px;font-weight:500;border-radius:8px;min-width:0;color:var(--ink)}
.cal button.has{background:var(--soft)} .cal button.sel{outline:2px solid var(--pro);outline-offset:-2px} .cal button.out{opacity:.35}
.cal .cv{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.copy{display:flex;gap:8px;flex-wrap:wrap}
.importbox{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{background:var(--soft);border-radius:999px;padding:2px 10px;font-size:.8rem}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:.84rem;color:var(--muted)}

function jourEntries(){

function allEntries(){

function nouveaux(b,base){

function baseOf(e){if(!e)return null;var m={};e.boosts.forEach(function(b){m[b.id]=+b.messages||0});return m}
function stInfo(s){return STATUTS[s]||{l:s?cap(String(s)):'?',c:'none'}}
function comptes(boosts){

  (boosts||[]).forEach(function(b){var i=stInfo(b.statut);if(i.hors){r.supprimes++;return}r.renseignes++;if(i.actif)r.actifs++;else if(b.statut==='pause')r.pause++;else r.autres++});

function comptesHtml(c,full){

}
function totaux(boosts,reels,base){

  (boosts||[]).forEach(function(b){if(!stInfo(b.statut).hors)mb+=nouveaux(b,base)});
  var r=reels==null||reels===''?null:+reels;
  return {actifs:c.actifs,pause:c.pause,supprimes:c.supprimes,renseignes:c.renseignes,total:c.renseignes,messagesBoosts:mb,reels:r,ecart:r==null?null:mb-r};

/* Statut d'un boost à une date : historique des statuts (boosts/{page}), sinon dernier état connu */
function bdef(pid,bid){var L=(S.bdefs[pid]||{}).liste||[];for(var i=0;i<L.length;i++)if(L[i].id===bid)return L[i];return null}
function statutAt(pid,bid,date,fb){
  var d=bdef(pid,bid);
  if(d&&d.hist&&d.hist.length){var s=null;d.hist.forEach(function(h){if(h.date<=date)s=h.statut});if(s)return s}
  var p=S.pages[pid];
  if(p&&p.boostsEtat&&p.boostsMaj&&ymdOf(p.boostsMaj)<=date){var x=null;p.boostsEtat.forEach(function(b){if(b.id===bid)x=b.statut});if(x)return x}

/* Liste des boosts d'une page à une date (statuts en vigueur ce jour-là) */
function boostList(pid,date,base){
  var out=[], seen={};
  (base||[]).forEach(function(b){seen[b.id]=1;var d=bdef(pid,b.id);out.push({id:b.id,nom:d&&d.nom||b.nom||'Boost',statut:statutAt(pid,b.id,date,b.statut),messages:b.messages})});
  ((S.bdefs[pid]||{}).liste||[]).forEach(function(d){if(seen[d.id])return;if(d.creeLe&&d.creeLe>date)return;seen[d.id]=1;out.push({id:d.id,nom:d.nom,statut:statutAt(pid,d.id,date,'actif'),messages:null})});

  if(p&&p.boostsEtat&&p.boostsMaj&&ymdOf(p.boostsMaj)<=date)p.boostsEtat.forEach(function(b){if(seen[b.id])return;seen[b.id]=1;out.push({id:b.id,nom:b.nom,statut:statutAt(pid,b.id,date,b.statut),messages:null})});

/* Valeur du jour d'une page. Un jour enregistré dans la grille fait foi ; sinon dernière saisie.

   compteur en baisse = anomalie (0 compté). */
function dayMap(){

        J:J?J.doc:null,jourId:J?J.jourId:null,import:!J&&last.auteur==='import',nv:nv,ref:ref,anomalies:an,counters:wC?wC.boosts:[],
        totaux:{actifs:c.actifs,pause:c.pause,supprimes:c.supprimes,renseignes:c.renseignes,total:c.renseignes,messagesBoosts:mb,reels:r,ecart:mb!=null&&r!=null?mb-r:null}};

/* Compteurs cumulés connus juste avant une date (pour calculer les nouveaux messages pendant la saisie) */
function cumBefore(pid,date){

function pageIds(filter){return Object.keys(S.pages).filter(function(id){return !S.pages[id].archivee&&(filter==null||filter==='all'||filter===id)}).sort(function(a,b){return S.pages[a].nom.localeCompare(S.pages[b].nom)})}

}
function dayTotal(dm,date,filter){

function aggregate(dm,k,g,filter){

var PERIODES=[['jour','Aujourd\'hui'],['hier','Hier'],['7j','7 derniers jours'],['sem','Cette semaine'],['semp','Semaine précédente'],['mois','Ce mois'],['perso','Période personnalisée']];
function periode(type,day,pa,pb){

function clampP(p){if(p.a<DEBUT)p.a=DEBUT;if(p.b<DEBUT)p.b=DEBUT;return p}

function setBoostStatus(pid,bid,statut){
  if(roGuard())return;
  var doc=defsFor(pid), d=null;doc.liste.forEach(function(x){if(x.id===bid)d=x});
  if(!d){var b=(latestState(pid,dayMap(),today())||{boosts:[]}).boosts.filter(function(x){return x.id===bid})[0];d={id:bid,nom:b?b.nom:'Boost',creeLe:null,hist:[]};doc.liste.push(d)}
  d.hist=d.hist.filter(function(h){return h.date!==today()});
  d.hist.push({statut:statut,date:today(),le:nowD().toISOString(),par:S.me,parNom:myName()});
  writeDefs(pid,doc,'✓ '+d.nom+' : '+stInfo(statut).l.toLowerCase()+' à partir du '+fmtD(today())+'.');
}
function addBoost(pid){
  if(roGuard())return;
  var doc=defsFor(pid), dm=dayMap(), st=latestState(pid,dm,today()), names={}, n=1;
  (st?st.boosts:[]).concat(doc.liste).forEach(function(b){names[b.nom]=1});
  while(names['Boost '+n])n++;
  doc.liste.push({id:'b'+uid(),nom:'Boost '+n,creeLe:today(),hist:[{statut:'actif',date:today(),le:nowD().toISOString(),par:S.me,parNom:myName()}]});
  writeDefs(pid,doc,'✓ Boost '+n+' ajouté. Son premier compteur servira de référence.');
}

function anomaliesOf(dm,pids,a,b){
  var out=[], t=today();
  pids.forEach(function(p){
    var d=dm[p]||{};
    Object.keys(d).forEach(function(k){
      if(k<a||k>b)return; var c=d[k];
      c.anomalies.forEach(function(x){out.push({p:p,d:k,type:'baisse',boost:x.nom,desc:'Compteur inférieur au compteur précédent ('+fmtD(x.prevDate)+')',av:x.prev,ap:x.cur})});
      var e=c.totaux.ecart,mb=c.totaux.messagesBoosts;
      if(e!=null&&Math.abs(e)>=Math.max(5,(mb||0)*0.2))out.push({p:p,d:k,type:'ecart',boost:'Tous les boosts',desc:e<0?'Messages réels supérieurs au total des messages boost':'Messages boost très supérieurs aux messages réels',av:mb,ap:c.totaux.reels});
    });
    for(var k=a<SAISIE_DEBUT?SAISIE_DEBUT:a;k<=b&&k<t;k=addDays(k,1)){if(dayStatus(p,k,dm)==='non'&&respAt(p,k))out.push({p:p,d:k,type:'manquant',boost:'—',desc:'Jour non enregistré',av:null,ap:null})}
  });
  return out.sort(function(x,y){return x.d<y.d?1:x.d>y.d?-1:0});
}

/* ---------- Accès individuel des employés (claude.ai) ----------
   Chaque employé a une fiche « inv_CODE » (lisible par l'administrateur seulement).
   L'employé ouvre le lien partagé, se connecte avec son compte claude.ai, puis son code
   (dans le lien ou tapé une fois) relie son compte à sa fiche : il voit les pages attribuées à cette fiche. */
var APP_URL='https://claude.ai/artifact/SiH7ckwK2MM7wetWjF6QW4';
function appUrl(){var u=shareUrl();return /^https:\/\/claude\.ai\/.*artifact\//.test(u)?u:APP_URL}
function codeFor(nom){
  var base=String(nom).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,5)||'EMP', c;
  do{c=base+String(Math.floor(1000+Math.random()*9000))}while(S.membres['inv_'+c]);
  return c;
}
function invites(){return Object.keys(S.membres).filter(function(u){return /^inv_/.test(u)}).sort(function(a,b){return String(S.membres[a].nom).localeCompare(String(S.membres[b].nom))})}

function invMessage(u){var m=S.membres[u];return 'Bonjour '+m.nom+', voici ton accès Compte Boost : '+invLink(m.code)+' — Ton code : '+m.code}
function addInvite(nom){
  nom=String(nom||'').trim(); if(!nom)return;
  var code=codeFor(nom), id='inv_'+code, d={nom:nom,code:code,creeLe:nowD().toISOString()};
  S.membres[id]=d; S.msgs.mem='✓ '+nom+' ajouté. Code : '+code+'. Attribue-lui ses pages, puis copie son lien.'; render();
  if(online())wSet('membres',id,d).catch(function(){delete S.membres[id];S.msgs.mem='Ajout refusé.';render()});
}

function linkCode(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!code){S.msgs.code='Écris ton code.';render();return}
  S.myInv=code; S.msgs.code=''; S.drafts={};

function impCompute(){
  var I=S.imp, rows=(I.sheets[I.sheet]||[]).filter(function(r){return r.some(function(v){return String(v).trim()!==''})});
  var width=rows.reduce(function(m,r){return Math.max(m,r.length)},1), headers=[];
  for(var i=0;i<width;i++)headers.push(I.head&&rows[0]?rows[0][i]:'');
  var body=I.head?rows.slice(1):rows, seen={}, exist={}, fresh=[], dup=0;
  Object.keys(S.pages).forEach(function(p){exist[S.pages[p].nom.trim().toLowerCase()]=1});
  body.forEach(function(r){var n=String(r[I.col]==null?'':r[I.col]).replace(/\s+/g,' ').trim();if(!n||/^[\d\s.,]+$/.test(n))return;var k=n.toLowerCase();if(seen[k])return;seen[k]=1;if(exist[k])dup++;else fresh.push(n)});
  return {headers:headers,fresh:fresh,dup:dup};
}
function impGuess(){
  var I=S.imp, rows=(I.sheets[I.sheet]||[]).filter(function(r){return r.some(function(v){return String(v).trim()!==''})});
  var first=rows[0]||[], col=-1;
  [/page/i,/compte|account/i,/nom|name/i].some(function(re){first.forEach(function(v,i){if(col<0&&re.test(String(v)))col=i});return col>=0});
  I.head=col>=0;

    I.head=rows.length>1&&rows[1].some(function(v){return /^[\d\s.,]+$/.test(String(v))})&&!first.some(function(v){return /^[\d\s.,]+$/.test(String(v))&&String(v).trim()!==''})}
  I.col=col;
}
function readImport(file){

    try{

      if(window.XLSX){var wb=XLSX.read(new Uint8Array(r.result),{type:'array'});wb.SheetNames.forEach(function(n){sheets[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:false})})}
      else if(/\.csv$/i.test(file.name)){var txt=new TextDecoder().decode(r.result);sheets.CSV=txt.split(/\r?\n/).map(function(l){return l.split(l.indexOf(';')>=0?';':',').map(function(v){return v.replace(/^"|"$/g,'')})})}
      else{S.imp=null;S.msgs.imp='Lecture Excel indisponible ici. Enregistre le fichier en CSV et réessaie.';render();return}
      var names=Object.keys(sheets).filter(function(n){return sheets[n].length});
      if(!names.length){S.imp=null;S.msgs.imp='Le fichier est vide.';render();return}
      S.imp={sheets:sheets,sheet:names[0],col:0,head:true}; impGuess(); S.msgs.imp=''; render();
    }catch(e){S.imp=null;S.msgs.imp='Impossible de lire ce fichier. Vérifie qu’il s’agit bien d’un fichier Excel (.xlsx) ou CSV.';render()}
  };

}

function viewBody(){
  if(!S.owner){
    if(!S.db)return '<div class="box"><p class="empty">Ouvre le lien d’accès que ton administrateur t’a envoyé, en étant connecté à claude.ai.</p></div>';

  }

var pending=false;

function go(v,extra){S.prevView=S.view;S.view=v;Object.assign(S,extra||{});S.modal=null;render();window.scrollTo(0,0)}

document.addEventListener('click',function(ev){

  if(ds.ftype){S.f.type=ds.ftype;render();return}
  if(ds.cmpt){S.cmpT=ds.cmpt;render();return}
  if(ds.chartm){S.chartM=ds.chartm;render();return}
  if(ds.htype){S.hist.type=ds.htype;render();return}
  if(ds.rnav){var r=sp('rnav'),n=+r[1];

    else if(r[0]==='e')S.eRef=addDays(monday(S.eRef||today()),7*n);

    render();return}
  if(ds.pageSheet){S.hist.type=S.hist.type||'tout';go('page',{sheetPid:ds.pageSheet});return}
  if(ds.empSheet){S.hist.page='';go('emp',{sheetEmp:ds.empSheet,empTab:'dash',ePid:pagesOf(ds.empSheet)[0]});return}
  if(ds.emptab){S.empTab=ds.emptab;render();return}
  if(ds.back){go(S.prevView&&S.prevView!==S.view?S.prevView:(S.owner?'dash':'dash'));return}
  if(ds.dayDetail){var x=sp('dayDetail');dayDetail(x[0],x[1]);return}
  if(ds.close){S.modal=null;render();return}
  if(ds.commit){var c=sp('commit');askCommit(c[0],c[1]);return}
  if(ds.docommit){commitDay(S.modal.pid,S.modal.d);return}
  if(ds.rect){var q=sp('rect');askRect(q[0],q[1]);return}
  if(ds.dorect){var mo=($('rectMotif')||{}).value||'';if(!mo.trim()){$('rectMsg').textContent='Le motif est obligatoire.';return}doRect(S.modal.pid,S.modal.d,mo.trim());return}
  if(ds.bst){var bs=sp('bst');setBoostStatus(bs[0],bs[1],bs[2]);return}
  if(ds.addboost){addBoost(ds.addboost);return}
  if(ds.sznav){S.sz.w0=addDays(szCols()[0],7*(+ds.sznav));render();return}
  if(ds.szrole){if(S.owner){S.sz.role=ds.szrole;S.ed={};render()}return}
  if(ds.szmode){S.sz.mode=ds.szmode;if(ds.szmode==='periode'){S.sz.a=S.sz.a||addDays(today(),-6);S.sz.b=S.sz.b||today()}render();return}
  if(ds.signal){var g=sp('signal');askDemande(g[0],g[1],'anomalie',g[2]);return}
  if(ds.askrect){var h=sp('askrect');askDemande(h[0],h[1],'rectification');return}
  if(ds.dodem){sendDemande();return}
  if(ds.treat){var tr=sp('treat');treatDemande(tr[0],tr[1]);return}
  if(ds.gotoSaisie){var gs=sp('gotoSaisie');S.sz.pid=gs[0];S.sz.mode='semaine';S.sz.w0=monday(gs[1]);if(S.owner)S.sz.role='admin';go('saisie');return}
  if(b.id==='exportPages'){exportPages();return}
  /* anciennes vues */
  if(ds.gotoPage){S.page=ds.gotoPage;S.sub='recap';go('recap');return}
  if(ds.pickPage){S.hist.type='tout';go('page',{sheetPid:ds.pickPage});return}
  if(ds.gran){S.gran=ds.gran;render();return}
  if(ds.dp){S.dp=ds.dp;render();return}
  if(ds.rp){S.rp=ds.rp;render();return}
  if(ds.mesure){S.mesure=ds.mesure;render();return}
  if(b.id==='rReset'){S.page='all';S.rEmp='';S.rBoost='';S.rStat='';render();return}
  if(ds.hist){S.histGran=ds.hist;render();return}
  if(ds.day){S.selDate=ds.day;S.calMonth=ds.day.slice(0,7);render();return}
  if(ds.cal){var m=S.calMonth||(S.selDate||today()).slice(0,7);if(ds.cal==='0'){S.selDate=today();S.calMonth=today().slice(0,7)}else{var dd=parse(m+'-01');dd.setMonth(dd.getMonth()+(+ds.cal));S.calMonth=ymd(dd).slice(0,7)}render();return}
  if(ds.valid){validate(ds.valid,true);return}
  if(ds.unvalid){validate(ds.unvalid,false);return}
  if(ds.archive){setPage(ds.archive,{archivee:true});return}
  if(ds.unarchive){setPage(ds.unarchive,{archivee:false});return}
  if(b.id==='impGo'){runImport();return}
  if(b.id==='impCancel'){S.imp=null;S.msgs.imp='';render();return}
  if(ds.copy!=null){var txt=ds.copy;navigator.clipboard.writeText(txt).then(function(){var o=b.textContent;b.textContent='✓ Copié';setTimeout(function(){b.textContent=o},1500)},function(){S.msgs.mem='Copie bloquée : '+txt;render()});return}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.modal){S.modal=null;render()}});
document.addEventListener('input',function(ev){
  var el=ev.target, ds=el.dataset;
  if(ds.cell){var c=ds.cell.split('|');editCell(c[0],c[1],'b',c[2],el.value);return}
  if(ds.reel){var r=ds.reel.split('|');editCell(r[0],r[1],'r',null,el.value);return}

});
document.addEventListener('change',function(ev){
  var el=ev.target, ds=el.dataset, v=el.value;
  if(ds.rdate){if(!v)return;var id=ds.rdate;if(id==='f')S.f.ref=v;else if(id==='rp')S.rpRef=v;else if(id==='e')S.eRef=v;else if(id==='h')S.hist.ref=v;render();return}
  var map={fPage:function(){S.f.page=v},fEmp:function(){S.f.emp=v;if(S.f.page!=='all'&&empPageIds().indexOf(S.f.page)<0)S.f.page='all';if(S.rpPage!=='all'&&empPageIds().indexOf(S.rpPage)<0)S.rpPage='all'},fA:function(){S.f.a=v},fB:function(){S.f.b=v},rpPage:function(){S.rpPage=v},rpType:function(){S.rpType=v},eStat:function(){S.eStat=v},
    ePage:function(){S.ePid=v},szPage:function(){S.sz.pid=v;S.ePid=v},szA:function(){S.sz.a=v},szB:function(){S.sz.b=v},hPage:function(){S.hist.page=v},hAut:function(){S.hist.aut=v},hAutP:function(){S.hist.autP=v},hA:function(){S.hist.a=v},hB:function(){S.hist.b=v},anT:function(){S.anT=v},
    dashPage:function(){S.page=v},recapPage:function(){S.page=v},calPage:function(){S.page=v},dA:function(){S.pa=v||null},dB:function(){S.pb=v||null},rA:function(){S.ra=v||null},rB:function(){S.rb=v||null},rEmp:function(){S.rEmp=v},rBoost:function(){S.rBoost=v},rStat:function(){S.rStat=v}};
  if(map[el.id]){map[el.id]();render();return}
  if(el.id==='objIn'){var o=Math.max(0,Math.round(+v||0));saveCfg({objectif:o||null});return}
  if(el.id==='seuilIn'){var n=Math.round(+v);if(n>=1&&n<=90)saveCfg({seuil:n});return}
  if(el.id==='impFile'){if(el.files[0])readImport(el.files[0]);return}
  if(el.id==='impSheet'){S.imp.sheet=v;impGuess();render();return}
  if(el.id==='impCol'){S.imp.col=+v;render();return}
  if(el.id==='impHead'){S.imp.head=el.checked;render();return}
  if(ds.assign){assignPage(ds.assign,v||null);return}
  if(ds.rename){var nm=v.trim();if(nm)setPage(ds.rename,{nom:nm});return}
  if(ds.label){setMember(ds.label,{libelle:v.trim()});return}
});
document.addEventListener('submit',function(ev){
  if(ev.target.id==='codeForm'){ev.preventDefault();linkCode($('codeIn').value);return}
  if(ev.target.id==='addInvite'){ev.preventDefault();addInvite($('newInvite').value);return}

  var id='p'+uid(), p={nom:n,responsable:null,archivee:false,creeLe:nowD().toISOString()};
  S.pages[id]=p; bump(); render();
  wSet('pages',id,p).then(function(){S.msgs.eq='Page « '+n+' » ajoutée.';soft()},function(){delete S.pages[id];S.msgs.eq='Ajout refusé.';render()});
});
setInterval(function(){var c=$('clk');if(c){var o=mg();c.textContent=o.hour+':'+o.minute+':'+o.second}},1000);
/* Changement de jour à minuit (heure de Madagascar) : on redessine */
var lastDay=today();setInterval(function(){var t=today();if(t!==lastDay){lastDay=t;bump();soft()}},30000);

/* ---------- Connexion aux données (temps réel) ---------- */
function docsOf(s){var o={};s.docs.forEach(function(d){var x=Object.assign({},d.data());x.id=d.id;o[d.id]=x});return o}
function subUser(u){
  if(S.subs[u])return; S.subs[u]=1;
  S.db.collection('saisies/'+u+'/entrees').onSnapshot(function(snap){S.entries[u]=snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});bump();soft()},function(){});
  if(u==='import')return;
  S.db.collection('saisies/'+u+'/brouillons').onSnapshot(function(snap){S.brou[u]=docsOf(snap);bump();if(!(S.view==='saisie'&&busyInput()))soft()},function(){});
  S.db.collection('saisies/'+u+'/demandes').onSnapshot(function(snap){S.dem[u]=snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});bump();soft()},function(){});
}
function watch(){
  var db=S.db;
  db.collection('pages').onSnapshot(function(s){var p={};s.docs.forEach(function(d){p[d.id]=Object.assign({},d.data())});S.pages=p;S.pagesOk=true;bump();soft()},function(){});
  db.collection('jours').onSnapshot(function(s){var j={};s.docs.forEach(function(d){j[d.id]=Object.assign({},d.data())});S.jours=j;bump();soft()},function(){});
  db.collection('boosts').onSnapshot(function(s){var j={};s.docs.forEach(function(d){j[d.id]=Object.assign({},d.data())});S.bdefs=j;bump();soft()},function(){});
  db.collection('config').onSnapshot(function(s){var c=null;s.docs.forEach(function(d){if(d.id==='params')c=Object.assign({},d.data())});S.cfg=c||{};S.cfgLoaded=true;bump();syncNoms();soft()},function(){S.cfgLoaded=true});
  if(S.owner){
    db.collection('membres').onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=Object.assign({},d.data())});S.membres=m;S.membresLoaded=true;Object.keys(m).filter(function(u){return !/^inv_/.test(u)}).forEach(subUser);bump();syncNoms();soft();resolveNames()},function(){});
    db.collection('validations').onSnapshot(function(s){var v={};s.docs.forEach(function(d){v[d.id]=Object.assign({},d.data())});S.valid=v;soft()},function(){});
    subUser('import');
  }
  if(S.me)subUser(S.me);
  db.collection('historique').onSnapshot(function(snap){
    var out=[];
    snap.docs.forEach(function(d){var h=d.data();(h.jours||[]).forEach(function(j){
      out.push({id:j.id,pageId:h.pageId,auteur:'import',fromHist:true,horodatage:j.horodatage,date:j.date,jour:j.jour,heure:j.heure,mode:'cumul',totaux:j.totaux,
        boosts:(j.boosts||[]).map(function(b){return{id:b.id,nom:b.nom||'Boost '+b.id.slice(1),statut:b.statut||'actif',messages:b.messages,nouveaux:b.nouveaux}})});
    })});
    var hp={},hi={};out.forEach(function(e){hp[e.pageId]=1});snap.docs.forEach(function(d){var h=d.data();hi[h.pageId]=h.importeLe||null});S.histPages=hp;S.histImp=hi;
    S.entries.historique=out; bump(); soft();
  },function(){});
}
function readHash(){var h=location.hash.slice(1), cm=/(^|&)code=([A-Za-z0-9]+)/.exec(h); if(cm)S.hashCode=cm[2].toUpperCase()}
function boot(){
  render(); readHash();
  if(!window.claude||!window.claude.use){S.ready=true;S.owner=false;render();return}
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    S.db=r[0]; S.user=r[1];
    var p=S.user?Promise.all([S.user.isOwner(),S.user.id(),S.user.name?S.user.name():Promise.resolve('')]):Promise.resolve([false,null,'']);
    return p.then(function(x){
      S.owner=!!x[0]; S.me=x[1]; S.ready=true; S.sz.role='emp';
      if(!S.db){render();return}
      if(!S.owner&&S.me){
        var ref=S.db.doc('membres/'+S.me);
        ref.get().then(function(s){
          var doc=s.exists&&s.data?Object.assign({},s.data()):null;
          if(!doc){doc={inscritLe:nowD().toISOString(),nomSaisi:x[2]||''};ref.set(doc).catch(function(){})}
          S.myDoc=doc; if(doc.invitation)S.myInv=doc.invitation;
          if(S.hashCode&&S.hashCode!==S.myInv)linkCode(S.hashCode); else render();
        }).catch(function(){});
      }
      watch(); render();
    });
  }).catch(function(){S.ready=true;render()});
}
boot();
})();
