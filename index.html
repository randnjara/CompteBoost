<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Compte Boost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barre d'onglets admin, tuiles de synthèse, tableaux de contrôle ; espace de saisie en cartes par page ; une colonne sur téléphone */
:root{
  --bg:#f0f6fb; --surface:#ffffff; --ink:#0f1e2b; --muted:#56697a; --line:#d5e3ee; --soft:#e5f1fa;
  --accent:#0284c7; --accent-ink:#ffffff; --sky:#e0f2fe; --skyink:#075985;
  --up:#15803d; --down:#c62828; --flat:#64748b; --upbg:#dcfce7; --downbg:#fde8e8; --flatbg:#eef2f6;
  --s1:#0284c7; --s2:#d97706; --s0:#b6c7d4;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1620; --surface:#13202c; --ink:#e2edf5; --muted:#8ea5b7; --line:#23384a; --soft:#1a2b3a;
  --accent:#38bdf8; --accent-ink:#04131f; --sky:#0f2e44; --skyink:#bae6fd;
  --up:#4ade80; --down:#f87171; --flat:#94a3b8; --upbg:#12321f; --downbg:#3b1717; --flatbg:#1f2b36;
  --s1:#1693d6; --s2:#c9760a; --s0:#3d5263; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1620; --surface:#13202c; --ink:#e2edf5; --muted:#8ea5b7; --line:#23384a; --soft:#1a2b3a;
  --accent:#38bdf8; --accent-ink:#04131f; --sky:#0f2e44; --skyink:#bae6fd;
  --up:#4ade80; --down:#f87171; --flat:#94a3b8; --upbg:#12321f; --downbg:#3b1717; --flatbg:#1f2b36;
  --s1:#1693d6; --s2:#c9760a; --s0:#3d5263; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.55rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.clock{font-family:var(--mono);font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{border:0;background:none;padding:10px 14px;font:600 .92rem var(--body);color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;border-radius:0}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.banner{background:var(--soft);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tile{background:var(--surface);padding:14px 16px;display:grid;gap:2px;align-content:start;min-width:0}
.tile .v{font-family:var(--display);font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .s{font-size:.85rem;min-height:1.3em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0;align-content:start}
.ph{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.d{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;border-radius:6px;padding:1px 7px;white-space:nowrap}
.d.up{color:var(--up);background:var(--upbg)} .d.down{color:var(--down);background:var(--downbg)} .d.flat{color:var(--flat);background:var(--flatbg)}
.d.plain{background:none;padding:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--upbg);color:var(--up)} .chip.todo{background:var(--downbg);color:var(--down)} .chip.none{background:var(--flatbg);color:var(--flat)}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.1fr);gap:10px}
.day{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;min-width:0}
.day .big{font-family:var(--display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.day.total{background:var(--soft);border-color:transparent}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=number]{font-family:var(--mono)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{padding:4px 10px;font-size:.85rem}
button.link{border:0;background:none;padding:4px 6px;color:var(--muted);font-weight:500}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 12px;background:var(--surface);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:600;padding:4px 0}
.cal button{min-height:58px;padding:6px;text-align:left;display:grid;align-content:space-between;gap:2px;font-weight:500;border-radius:8px;min-width:0}
.cal button.has{background:var(--soft)}
.cal button.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal button.out{opacity:.35}
.cal .cv{font-family:var(--mono);font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pagecard{display:grid;gap:12px}
.nv{font-weight:700;color:var(--up);text-align:right}
.boost{display:grid;grid-template-columns:minmax(0,1fr) 130px 110px 64px auto;gap:8px;align-items:center}
.boost.del input,.boost.del select{opacity:.55}
.sumrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.sumrow>div{background:var(--soft);border-radius:10px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.sumrow .v{font-family:var(--mono);font-weight:700;font-size:1.15rem}
.compare{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:1.05rem}
.compare .vs{font-family:var(--display);font-size:1.5rem;font-weight:700}
.msg{font-size:.88rem;min-height:1.3em}
.msg.ok{color:var(--up)} .msg.err{color:var(--down)}
.empty{color:var(--muted);text-align:center;padding:26px 8px;white-space:normal}
.copy{display:flex;gap:8px;flex-wrap:wrap}
.copy input{flex:1 1 260px;font-family:var(--mono);font-size:.82rem}
.reelbox{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--soft);border:2px solid var(--accent);border-radius:12px;padding:12px 14px}
.reelbox label{display:grid;gap:2px;cursor:pointer}
.reelbox .rt{font-family:var(--display);font-weight:700;font-size:1.05rem}
.reelbox input{font-size:1.6rem;font-weight:700;width:170px;background:var(--surface)}
.importbox{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.names{display:flex;flex-wrap:wrap;gap:6px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.names span{background:var(--soft);border-radius:999px;padding:2px 10px;font-size:.82rem}
header.top{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 18px}
header.top .label{color:inherit;opacity:.85}
header.top .clock{background:rgba(255,255,255,.16);border-color:transparent;color:inherit}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:14px;padding:12px 14px;display:grid;gap:3px;align-content:start;min-width:0}
.card .v{font-family:var(--display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.card .s{font-size:.82rem;min-height:1.3em}
.okc{color:var(--up)} .downc{color:var(--down)}
.cpt{font-family:var(--mono);font-weight:700;white-space:nowrap}
.pbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week button{display:grid;gap:0;justify-items:center;padding:6px 4px;background:var(--soft);border-color:transparent;font-weight:600}
.week button span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.week button b{font-family:var(--display);font-size:1.15rem}
.week button.tday{border-color:var(--accent)}
.week button.on{background:var(--accent);color:var(--accent-ink)} .week button.on span{color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-radius:999px;padding:5px 12px;font-size:.86rem;background:var(--surface)}
.chips button[aria-pressed="true"]{background:var(--sky);color:var(--skyink);border-color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.alerts li{display:flex;gap:8px;align-items:flex-start;background:var(--downbg);border-radius:10px;padding:8px 12px;font-size:.92rem}
.alertp{border-color:var(--down)}
.okline{background:var(--upbg);color:var(--up);border-radius:10px;padding:8px 12px;font-size:.9rem;font-weight:600}
details summary{cursor:pointer;font-weight:600}
.wcmp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wcmp>div{background:var(--soft);border-radius:10px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.wcmp .v{font-family:var(--display);font-weight:700;font-size:1.25rem}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days7 .dl{background:var(--soft);border-radius:10px;padding:6px 8px;display:grid;gap:2px;min-width:0;font-size:.85rem}
.days7 .dl b{font-size:1.05rem}
.days7 .d{font-size:.72rem;padding:0 4px}
tr.tot td{border-top:2px solid var(--ink);background:var(--soft);font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.fl{display:grid;gap:3px}
.boostbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.boostbox summary{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select.st-actif{color:var(--up);font-weight:700} select.st-pause{color:var(--down);font-weight:700}
button.big{font-size:1.05rem;padding:10px 20px}
@media (max-width:640px){.wcmp{grid-template-columns:repeat(2,minmax(0,1fr))}.days7{grid-template-columns:repeat(4,minmax(0,1fr))}.week b{font-size:1rem}}
[hidden]{display:none!important}
@media (max-width:980px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .three{grid-template-columns:repeat(3,minmax(0,1fr))}.day.total{grid-column:1/-1}
  .day .big{font-size:1.4rem}
  .boost{grid-template-columns:1fr 1fr}.boost .bn{grid-column:1/-1}
  .sumrow{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>

<div class="wrap">
  <header class="top">
    <div><div class="label" id="roleLabel">Chargement</div><h1>Compte Boost</h1></div>
    <div class="clock" id="clock" aria-live="off"></div>
  </header>
  <div class="banner" id="demoBanner" hidden><span id="demoText">Données d'exemple affichées. Rien n'est enregistré.</span><button class="small" id="demoOff" type="button">Quitter les exemples</button></div>
  <div class="banner" id="noDb" hidden><span>Enregistrement indisponible dans cet affichage. Ouvre la page depuis claude.ai en étant connecté.</span></div>

  <main id="view"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
var JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var JC=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
var MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
/* Statuts des comptes Boost. Pour en ajouter un plus tard : une ligne ici.
   actif:true = compte comme actif ; hors:true = ne compte plus parmi les comptes renseignés. */
/* Date de départ du suivi : rien avant cette date dans les statistiques, graphiques et historiques */
var DEBUT='2026-10-05';
var STATUTS={actif:{l:'Actif',actif:true,c:'ok'},pause:{l:'Pause',c:'todo'},supprime:{l:'Supprimé',hors:true,c:'none'}};
var S={db:null,user:null,me:null,owner:false,pages:{},membres:{},entries:{},valid:{},names:{},
  demo:false,tab:'dash',gran:'semaine',page:'all',calMonth:null,selDate:null,histGran:'jour',threeRef:null,drafts:{},msgs:{},subs:{},open:{},
  dp:'jour',dDay:null,dWeek:null,ePage:null,myInv:null,myDoc:null,hashCode:null,pa:null,pb:null,rp:'7j',ra:null,rb:null,rEmp:'',rBoost:'',rStat:'',mesure:'b'};
var $=function(id){return document.getElementById(id)};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function today(){return ymd(new Date())}
function nf(n){return n==null||isNaN(n)?'—':Math.round(n).toLocaleString('fr-FR')}
function isoWeek(s){var d=parse(s);var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);var y=t.getUTCFullYear();var w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return{y:y,w:w}}
function weekKey(s){var w=isoWeek(s);return w.y+'-S'+pad(w.w)}
function monday(s){var d=parse(s);var k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d)}
function pkey(s,g){return g==='jour'?s:g==='semaine'?weekKey(s):g==='mois'?s.slice(0,7):s.slice(0,4)}
function pstep(s,g,n){var d=parse(s);if(g==='jour')d.setDate(d.getDate()+n);else if(g==='semaine')d.setDate(d.getDate()+7*n);else if(g==='mois'){d.setDate(1);d.setMonth(d.getMonth()+n)}else{d.setMonth(0,1);d.setFullYear(d.getFullYear()+n)}return ymd(d)}
function plabel(k,g,ref){
  if(g==='jour'){var d=parse(k);return cap(JOURS[d.getDay()])+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)}
  if(g==='semaine'){var m=monday(ref);var e=addDays(m,6);return 'Semaine '+(+k.split('-S')[1])+' · '+m.slice(8)+'/'+m.slice(5,7)+'–'+e.slice(8)+'/'+e.slice(5,7)}
  if(g==='mois'){return cap(MOIS[+k.slice(5)-1])+' '+k.slice(0,4)}
  return k;
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function dayName(s){return cap(JOURS[parse(s).getDay()])}
function short(s){return s.slice(8)+'/'+s.slice(5,7)}
/* Flèche + écart : ↑ vert, ↓ rouge, → neutre */
function delta(d,opts){
  opts=opts||{};
  if(d==null||isNaN(d))return '<span class="muted">—</span>';
  var c=d>0?'up':d<0?'down':'flat', a=d>0?'↑':d<0?'↓':'→';
  var t=a+(opts.noNum?'':' '+(d>0?'+':d<0?'−':'')+nf(Math.abs(d)));
  if(opts.pct!=null&&isFinite(opts.pct)&&d!==0)t+=' <span style="font-weight:500">('+(opts.pct>0?'+':'−')+Math.abs(opts.pct).toFixed(1).replace('.',',')+' %)</span>';
  return '<span class="d '+c+(opts.plain?' plain':'')+'">'+t+'</span>';
}
function pct(a,b){return b?((a-b)/b)*100:null}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

/* ---------- Stockage : claude.ai (db) ou feuille Google (Apps Script) ---------- */
var API={url:null,key:null};
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function online(){return !S.demo&&!!S.mode}
function api(action,params){
  var body=Object.assign({action:action,key:API.key},params||{});
  return fetch(API.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.json()}).then(function(j){if(!j||!j.ok)throw new Error(j&&j.error||'Réponse invalide');return j.data});
}
function wSet(col,id,data){return S.mode==='claude'?S.db.doc(col+'/'+id).set(data):api('set',{col:col,id:id,data:data})}
function wUpdate(col,id,patch){return S.mode==='claude'?S.db.doc(col+'/'+id).update(patch):api('update',{col:col,id:id,data:patch})}
function wSetMany(col,docs){
  if(S.mode==='sheets')return api('setMany',{col:col,docs:docs});
  return docs.reduce(function(pr,d){return pr.then(function(){return S.db.doc(col+'/'+d.id).set(d.data)})},Promise.resolve());
}
function wAddEntry(e){
  if(S.mode==='sheets')return api('addEntry',{entry:e});
  return S.db.collection('saisies/'+S.me+'/entrees').add(e).then(function(){return e});
}
function linkFor(key){return location.origin+location.pathname+'#api='+encodeURIComponent(API.url)+'&k='+encodeURIComponent(key)}

/* ---------- Données dérivées ---------- */
function allEntries(){var out=[];Object.keys(S.entries).forEach(function(u){out=out.concat(S.entries[u]||[])});return out}
/* Compteurs cumulés : nouveaux messages = compteur du jour − compteur de la saisie précédente.
   base = null : premier relevé de la page (0 nouveau) ; base absente : ancien mode (messages du jour). */
function nouveaux(b,base){
  var c=+b.messages||0; if(base===undefined)return c; if(base===null)return 0;
  if(!(b.id in base))return c; var p=+base[b.id]||0; return c>=p?c-p:0;
}
function baseOf(e){if(!e)return null;var m={};e.boosts.forEach(function(b){m[b.id]=+b.messages||0});return m}
/* Comptes Boost : seul le statut décide. « Renseignés » = tous sauf les statuts hors compte (supprimé). */

/* Valeur du jour d'une page, construite à partir de toutes les saisies du jour :

   statuts = dernière liste de boosts connue (reportée d'un jour à l'autre). */
function dayMap(){
  var by={}; S.preB={}; var hp=S.histPages||{};
  allEntries().forEach(function(e){if(!S.pages[e.pageId])return;if(e.auteur==='import'&&!e.fromHist&&hp[e.pageId])return;var p=by[e.pageId]||(by[e.pageId]={});(p[e.date]=p[e.date]||[]).push(e)});
  var m={};
  Object.keys(by).forEach(function(pid){
    var out=m[pid]={}, lastB=null;
    Object.keys(by[pid]).sort().forEach(function(d){
      var es=by[pid][d].sort(function(a,b){return a.horodatage<b.horodatage?-1:1});
      var wB=null,wC=null,wR=null;
      es.forEach(function(e){if(e.boosts&&e.boosts.length){wB=e;if(e.saisieCompteurs!==false)wC=e}if(e.totaux&&e.totaux.reels!=null)wR=e});
      if(wB)lastB=wB;

      var mb=wC?wC.totaux.messagesBoosts:null, r=wR?wR.totaux.reels:null;
      out[d]={pageId:pid,date:d,jour:last.jour,heure:last.heure,horodatage:last.horodatage,auteur:(wR||last).auteur,boosts:boosts,boostsDuJour:!!wC,entries:es,reelEntry:wR,
        totaux:{actifs:c.actifs,pause:c.pause,supprimes:c.supprimes,renseignes:c.renseignes,total:c.renseignes,messagesBoosts:mb,reels:r,ecart:mb!=null&&r!=null?mb-r:null}};

/* ---------- Périodes et totaux sur une plage de dates ---------- */
var PERIODES=[['jour','Aujourd\'hui'],['hier','Hier'],['7j','7 derniers jours'],['sem','Cette semaine'],['semp','Semaine précédente'],['mois','Ce mois'],['perso','Période personnalisée']];
function periode(type,day,pa,pb){

  if(type==='hier')return {a:addDays(t,-1),b:addDays(t,-1)};
  if(type==='7j')return {a:addDays(t,-6),b:t};
  if(type==='sem')return {a:m,b:t};
  if(type==='semp')return {a:addDays(m,-7),b:addDays(m,-1)};
  if(type==='mois')return {a:t.slice(0,8)+'01',b:t};

function clampP(p){if(p.a<DEBUT)p.a=DEBUT;if(p.b<DEBUT)p.b=DEBUT;return p}
function nDays(p){return Math.round((parse(p.b)-parse(p.a))/864e5)+1}

function dayVals(c,f){

  if(f&&(f.boost||f.statut)){
    if(!c.boostsDuJour)b=null;
    else{b=0;c.boosts.forEach(function(x){if(stInfo(x.statut).hors)return;if(f.boost&&x.nom!==f.boost)return;if(f.statut&&x.statut!==f.statut)return;b+=(+x.nouveaux||0)})}
  }

function rangeAgg(dm,a,b,pids,f){
  var r={b:0,r:0,nB:0,nR:0,nBR:0,bBR:0,rBR:0,days:{},pages:{}};
  pids.forEach(function(pid){
    var d=dm[pid]||{}, pp=r.pages[pid]={b:0,r:0,nB:0,nR:0,nBR:0,bBR:0,rBR:0};
    Object.keys(d).forEach(function(k){

function impCompute(){

  Object.keys(S.pages).forEach(function(p){exist[S.pages[p].nom.trim().toLowerCase()]=1});

var saved=null;
function startDemo(){
  saved={pages:S.pages,membres:S.membres,entries:S.entries,valid:S.valid,me:S.me};
  S.demo=true; S.pages={}; S.membres={}; S.entries={}; S.valid={};
  S.me=S.me||'moi';
  var emp=['e1','e2'];
  S.membres={e1:{libelle:'Employé 1'},e2:{libelle:'Employé 2'}};
  var defs=[['pa','Page A','e1',170,5],['pb','Page B','e2',215,-6],['pc','Page C','e1',120,2]];
  defs.forEach(function(d){S.pages[d[0]]={nom:d[1],responsable:d[2],archivee:false}});
  var seed=7; function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  defs.forEach(function(d){
    var base=d[3], cum=[], prevBase=null, n=3+Math.floor(rnd()*3);
    for(var i=34;i>=0;i--){
      var date=addDays(today(),-i), boosts=[];
      base=Math.max(40,base+d[4]*0.3+Math.round((rnd()-0.5)*16));
      var share=base*(0.85+rnd()*0.25);
      for(var k=0;k<n;k++){cum[k]=(cum[k]||0)+Math.round(share/n);boosts.push({id:d[0]+k,nom:'Boost '+(k+1),statut:k===n-1&&rnd()>0.5?'pause':(k===0&&rnd()>0.85?'supprime':'actif'),messages:cum[k]})}
      boosts.forEach(function(b){b.nouveaux=nouveaux(b,prevBase)});
      var dt=parse(date); dt.setHours(i?17:8,Math.floor(rnd()*59));
      var e={id:d[0]+i,pageId:d[0],auteur:d[2],horodatage:dt.toISOString(),date:date,jour:JOURS[dt.getDay()],heure:pad(dt.getHours())+':'+pad(dt.getMinutes()),boosts:boosts,mode:'cumul',totaux:totaux(boosts,Math.round(base),prevBase)};
      prevBase=baseOf(e);
      (S.entries[d[2]]=S.entries[d[2]]||[]).push(e);
    }
  });
  S.valid[weekKey(pstep(today(),'semaine',-1))+'_pa']={statut:'valide',leTexte:'exemple'};
  S.drafts={}; render();
}

/* ---------- Connexion aux données ---------- */
function errBar(){return S.loadErr&&!S.demo?'<div class="banner" style="margin-bottom:14px"><span>Connexion à la feuille Google impossible pour le moment ('+esc(S.loadErr)+'). Les chiffres affichés peuvent dater.</span><button class="small" type="button" id="retryLoad">Réessayer</button></div>':''}
function randKey(){var a=new Uint8Array(18);try{crypto.getRandomValues(a)}catch(e){for(var i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256)}return Array.prototype.map.call(a,function(x){return pad(x.toString(16))}).join('').replace(/^(.)(.)/,'$1$2')}
function pendingKey(){if(!S.pkey){S.pkey=lsGet('cb.pendingKey')||randKey();lsSet('cb.pendingKey',S.pkey)}return S.pkey}
function viewSetup(){
  var bad=S.setup==='bad';
  var step=function(n,t,body){return '<div style="display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start"><span class="num" style="background:var(--accent);color:var(--accent-ink);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:700">'+n+'</span><div style="display:grid;gap:6px;min-width:0"><strong>'+t+'</strong>'+(body||'')+'</div></div>'};
  return '<section class="panel" style="max-width:760px">'+
    (bad?'<div class="banner"><span>Ce lien ne fonctionne plus ('+esc(S.setupErr||'')+'). Si tu es employé, demande un nouveau lien à ton administrateur.</span></div>':'')+
    '<h2>Brancher Compte Boost sur ta feuille Google</h2><p class="muted" style="margin:0">À faire une seule fois, par l\'administrateur. Tes données seront enregistrées dans ta feuille, dans de nouveaux onglets « CB_… ». Tes onglets actuels ne sont pas modifiés.</p>'+
    '<p class="muted" style="margin:0">Tu es employé ? Ouvre plutôt le lien que ton administrateur t\'a envoyé.</p>'+
    step(1,'Ouvre ta feuille Google des comptes Boost')+
    step(2,'Clique sur Extensions, puis Apps Script')+
    step(3,'Efface tout le code affiché, puis colle celui-ci','<div class="row"><button class="primary" type="button" id="copyCode">Copier le code</button><span class="muted" id="codeMsg" style="font-size:.85rem"></span></div><textarea id="codeBox" hidden readonly style="width:100%;min-height:120px;font:12px var(--mono)"></textarea>')+
    step(4,'Clique sur l\'icône disquette (Enregistrer)')+
    step(5,'Clique sur Déployer, puis Nouveau déploiement','<span class="muted">Roue dentée → <b>Application Web</b>. « Exécuter en tant que » : <b>Moi</b>. « Qui a accès » : <b>Tout le monde</b>. Clique sur <b>Déployer</b>, puis <b>Autoriser l\'accès</b> et choisis ton compte. Si Google affiche « Google n\'a pas validé cette application », clique sur <b>Paramètres avancés</b>, puis <b>Accéder à … (non sécurisé)</b>, puis <b>Autoriser</b>.</span>')+
    step(6,'Copie l\'« URL de l\'application Web » et colle-la ici','<form id="setupForm" class="copy"><input id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec" required><button class="primary" type="submit">Terminer</button></form><div class="msg" id="setupMsg" role="status"></div>')+
    '<div class="row"><button type="button" id="demoOn">Voir avec des exemples</button></div></section>';
}
function getCode(){
  return fetch('apps-script/Code.gs').then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){return t.replace('__ADMIN_KEY__',pendingKey())});
}
function finishSetup(){
  var u=$('apiUrl').value.trim(), m=$('setupMsg');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec/.test(u)){m.className='msg err';m.textContent='Colle l’adresse qui commence par https://script.google.com/macros/s/ et finit par /exec.';return}
  API.url=u; API.key=pendingKey(); m.className='msg';m.textContent='Vérification…';
  api('whoami').then(function(w){
    if(w.role!=='admin')throw new Error('clé administrateur différente');
    lsSet('cb.api',API.url);lsSet('cb.key',API.key);lsSet('cb.pendingKey',null);
    S.setup=null;S.mode='sheets';S.owner=true;S.me='admin';S.tab='equipe';S.msgs.eq='✓ Ta feuille Google est branchée. Copie ton lien administrateur ci-contre et garde-le.';
    return sheetsLoad().then(function(){render()});
  }).catch(function(err){API.url=null;m.className='msg err';m.textContent='Échec : '+(err&&err.message||'connexion impossible')+'. Vérifie que « Qui a accès » est bien « Tout le monde » et que tu as collé le code de l’étape 3 (recopie-le si tu as rechargé cette page).'});
}
function sheetsLoad(){
  if(S.demo)return Promise.resolve();
  return api(S.owner?'all':'me').then(function(d){
    if(S.demo)return;
    if(S.owner){S.pages=d.pages||{};S.membres=d.membres||{};S.valid=d.validations||{};var en={};(d.saisies||[]).forEach(function(e){(en[e.auteur]=en[e.auteur]||[]).push(e)});S.entries=en}
    else{S.pages=d.pages||{};S.membres={};S.membres[S.me]={libelle:d.moi.nom};S.entries={};S.entries[S.me]=d.saisies||[]}
    S.loadErr='';soft();
  },function(err){S.loadErr=String(err&&err.message||err);soft()});
}
function subEntries(u){
  if(S.subs[u])return;
  S.subs[u]=S.db.collection('saisies/'+u+'/entrees').onSnapshot(function(snap){
    S.entries[u]=snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});
    if(!S.demo)soft();
  },function(){});
}
function watch(){
  var db=S.db;
  db.collection('pages').onSnapshot(function(s){if(S.demo)return;var p={};s.docs.forEach(function(d){p[d.id]=Object.assign({},d.data())});S.pages=p;soft()},function(){});
  if(S.owner){
    db.collection('membres').onSnapshot(function(s){if(S.demo)return;var m={};s.docs.forEach(function(d){m[d.id]=Object.assign({},d.data())});S.membres=m;Object.keys(m).filter(function(u){return !/^inv_/.test(u)}).forEach(subEntries);soft();resolveNames()},function(){});
    db.collection('validations').onSnapshot(function(s){if(S.demo)return;var v={};s.docs.forEach(function(d){v[d.id]=Object.assign({},d.data())});S.valid=v;soft()},function(){});
  }
  if(S.me)subEntries(S.me);
  if(S.owner)subEntries('import');
  db.collection('historique').onSnapshot(function(snap){
    var out=[];
    snap.docs.forEach(function(d){var h=d.data();(h.jours||[]).forEach(function(j){
      out.push({id:j.id,pageId:h.pageId,auteur:'import',fromHist:true,horodatage:j.horodatage,date:j.date,jour:j.jour,heure:j.heure,mode:'cumul',totaux:j.totaux,
        boosts:(j.boosts||[]).map(function(b){return{id:b.id,nom:b.nom||'Boost '+b.id.slice(1),statut:b.statut||'actif',messages:b.messages,nouveaux:b.nouveaux}})});
    })});
    var hp={};out.forEach(function(e){hp[e.pageId]=1});S.histPages=hp;
    S.entries.historique=out; if(!S.demo)soft();
  },function(){});
}
function readHash(){
  var h=location.hash.slice(1), cm=/(^|&)code=([A-Za-z0-9]+)/.exec(h); if(cm)S.hashCode=cm[2].toUpperCase(); if(!/(^|&)(api|k)=/.test(h))return;
  var q={}; h.split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0)q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1))});
  if(q.api)lsSet('cb.api',q.api); if(q.k)lsSet('cb.key',q.k);
  API.url=q.api||null; API.key=q.k||null;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
}
function boot(){
  render();
  readHash(); API.url=API.url||lsGet('cb.api'); API.key=API.key||lsGet('cb.key');
  if(API.url&&API.key){
    S.mode='sheets';
    api('whoami').then(function(w){
      S.owner=w.role==='admin'; S.me=w.id;
      return sheetsLoad().then(function(){S.ready=true;render();setInterval(function(){if(!document.hidden&&!busyInput())sheetsLoad()},60000)});
    }).catch(function(err){if(/invalide/i.test(String(err&&err.message))){lsSet('cb.key',null);lsSet('cb.api',null)}S.mode=null;S.ready=true;S.owner=true;S.setup='bad';S.setupErr=String(err&&err.message||err);render()});
    return;
  }
  if(!window.claude||!window.claude.use){S.owner=true;S.setup='install';S.ready=true;render();return}
  S.mode='claude';
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    S.db=r[0]; S.user=r[1];
    var p=S.user?Promise.all([S.user.isOwner(),S.user.id(),S.user.name?S.user.name():Promise.resolve('')]):Promise.resolve([true,null,'']);
    return p.then(function(x){
      S.owner=!!x[0]; S.me=x[1]; S.ready=true;
      if(!S.db){S.mode=null;$('noDb').hidden=false;render();return}
      if(!S.owner&&S.me){
        var ref=S.db.doc('membres/'+S.me);
        ref.get().then(function(s){
          var doc=s.exists&&s.data?Object.assign({},s.data()):null;
          if(!doc){doc={inscritLe:new Date().toISOString(),nomSaisi:x[2]||''};ref.set(doc).catch(function(){})}
          S.myDoc=doc; if(doc.invitation)S.myInv=doc.invitation;
          if(S.hashCode&&S.hashCode!==S.myInv)linkCode(S.hashCode); else render();
        }).catch(function(){});
      }
      watch(); render();
    });
  }).catch(function(){S.mode=null;$('noDb').hidden=false;S.owner=true;S.ready=true;render()});
}
boot();
})();
</script>

</body>
